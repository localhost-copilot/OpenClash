name: Compile The New Version OpenClash

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Get-Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: New Version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' luci-app-openclash/Makefile)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify updater
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          luajit tests/releases.lua
          luajit tests/version-fetch.lua
          node tests/download-urls.js
          python3 -m unittest discover -s tests -v

  Compile:
    runs-on: ubuntu-latest
    needs: Get-Version
    strategy:
      matrix:
        target:
          - { name: ipk, sdk_url: "https://mirrors.pku.edu.cn/openwrt/releases/22.03.0/targets/x86/64/openwrt-sdk-22.03.0-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz", sdk_tar: "SDK.tar.xz", sdk_backup_tar: "SDK.tar.bz2", sdk_dir: "SDK", artifact_pattern: "luci-app-openclash_*.ipk" }
          - { name: apk, sdk_url: "snapshot", sdk_tar: "SNAPSDK.tar.zst", sdk_backup_tar: "SNAPSDK.tar.zst", sdk_dir: "SNAPSDK", artifact_pattern: "luci-app-openclash-*.apk" }
    steps:
      - name: Checkout OpenClash Source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar zstd python3 python3-pyelftools python3-setuptools

      - name: Download SDK
        run: |
          mkdir -p tmp
          if [ "${{ matrix.target.name }}" = "ipk" ]; then
            if ! curl -SLfk --connect-timeout 30 --retry 2 "${{ matrix.target.sdk_url }}" -o "./tmp/${{ matrix.target.sdk_tar }}"; then
              curl -SLfk --connect-timeout 30 --retry 2 "https://archive.openwrt.org/chaos_calmer/15.05.1/x86/64/OpenWrt-SDK-15.05.1-x86-64_gcc-4.8-linaro_uClibc-0.9.33.2.Linux-x86_64.tar.bz2" -o "./tmp/${{ matrix.target.sdk_backup_tar }}"
              cd tmp
              tar xjf ${{ matrix.target.sdk_backup_tar }}
              mv OpenWrt-SDK-* ${{ matrix.target.sdk_dir }}
            else
              cd tmp
              tar xf ${{ matrix.target.sdk_tar }}
              mv openwrt-sdk-* ${{ matrix.target.sdk_dir }}
            fi
          else
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
            SDK_NAME=$(curl -sf $BASE_URL | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
            if ! curl -SLfk --connect-timeout 30 --retry 2 "$BASE_URL/$SDK_NAME" -o "./tmp/${{ matrix.target.sdk_tar }}"; then
              BASE_URL2="https://mirrors.pku.edu.cn/files/openwrt/snapshots/targets/x86/64/"
              SDK_NAME=$(curl -sf $BASE_URL2 | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
              curl -SLfk --connect-timeout 30 --retry 2 "$BASE_URL2/$SDK_NAME" -o "./tmp/${{ matrix.target.sdk_tar }}"
            fi
            cd tmp
            zstd -d ${{ matrix.target.sdk_tar }}
            tar xf SNAPSDK.tar
            SDK_DIR=$(tar tf SNAPSDK.tar | head -n 1 | cut -d/ -f1)
            mv "$SDK_DIR" "${{ matrix.target.sdk_dir }}"
          fi

      - name: Copy OpenClash Source Codes
        run: |
          mkdir -p tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash
          cp -rf ./luci-app-openclash/. tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/
          if [ "${{ matrix.target.name }}" = "apk" ]; then
            find tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash -type f -name "Makefile" -exec sed -i 's/DEPENDS:=+dnsmasq-full/DEPENDS:=+dnsmasq-full +luci-compat/g' {} \;
          fi

      - name: Update Third-Party Resources
        run: |
          CHNR_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/root/etc/openclash/china_ip_route.ipset
          CHNR6_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/root/etc/openclash/china_ip6_route.ipset
          ZASHBOARD_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/root/usr/share/openclash/ui/zashboard
          METACUBEXD_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/root/usr/share/openclash/ui/metacubexd
          GEOSITE_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/root/etc/openclash/GeoSite.dat
          COUNTRY_MMDB_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/root/etc/openclash/Country.mmdb

          # 更新 China IP Route
          mkdir -p tmp
          curl -sSL https://ispip.clang.cn/all_cn.txt -o tmp/china_ip_route.ipset
          mkdir -p $(dirname $CHNR_PATH)
          cp tmp/china_ip_route.ipset $CHNR_PATH
          curl -sSL https://ispip.clang.cn/all_cn_ipv6.txt -o tmp/china_ip6_route.ipset
          mkdir -p $(dirname $CHNR6_PATH)
          cp tmp/china_ip6_route.ipset $CHNR6_PATH

          # 更新 MetaCubeXD UI
          mkdir -p tmp/metacubexd_zip
          curl -sSL https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip -o tmp/metacubexd.zip
          unzip -q -o tmp/metacubexd.zip -d tmp/metacubexd_zip
          METACUBEXD_UNZIP_PATH="tmp/metacubexd_zip/metacubexd-gh-pages"
          mkdir -p "$METACUBEXD_PATH"
          rm -rf "$METACUBEXD_PATH"/*
          cp -rf "$METACUBEXD_UNZIP_PATH"/* "$METACUBEXD_PATH"

          # 更新 ZashBoard UI
          mkdir -p tmp/zashboard_zip
          curl -sSL https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip -o tmp/zashboard.zip
          unzip -q -o tmp/zashboard.zip -d tmp/zashboard_zip
          mkdir -p "$ZASHBOARD_PATH"
          rm -rf "$ZASHBOARD_PATH"/*
          cp -rf tmp/zashboard_zip/dist/* "$ZASHBOARD_PATH"

          # 提取国旗字体
          FONTS_PATH=tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/root/www/luci-static/resources/openclash/fonts
          mkdir -p "$FONTS_PATH"
          TWEMOJI_FONT=$(ls tmp/zashboard_zip/dist/assets/TwemojiMozilla-flags-*.woff2 2>/dev/null | head -1)
          if [ -n "$TWEMOJI_FONT" ]; then
            cp "$TWEMOJI_FONT" "$FONTS_PATH/TwemojiMozilla-flags.woff2"
          fi

          # 更新 GeoSite.dat
          RULES_RELEASE=$(curl -s https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/releases/latest | jq -r '.tag_name')
          curl -sSL "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${RULES_RELEASE}/geosite.dat" -o tmp/GeoSite.dat
          mkdir -p $(dirname "$GEOSITE_PATH")
          cp tmp/GeoSite.dat "$GEOSITE_PATH"

          # 更新 Country.mmdb
          curl -sSL "https://github.com/alecthw/mmdb_china_ip_list/releases/latest/download/Country-lite.mmdb" -o tmp/Country.mmdb
          mkdir -p $(dirname "$COUNTRY_MMDB_PATH")
          cp tmp/Country.mmdb "$COUNTRY_MMDB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Bundles & Minify CSS/JS
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/tools/codemirror
          # Install dependencies
          npm install
          # Build CodeMirror 6 core bundle
          npx esbuild entry.js --bundle --format=iife --global-name=CM6 --minify --target=es2019 --outfile=../../root/www/luci-static/resources/openclash/js/cm6.min.js --legal-comments=none --loader:.css=text
          # Build the markdown preview bundle (lazy-loaded by CM6.ensureMarkdown)
          npx esbuild entry-md-render.js --bundle --format=iife --global-name=OCMarkdown --minify --target=es2019 --outfile=../../root/www/luci-static/resources/openclash/js/md-render.min.js --legal-comments=none --loader:.css=text
          # Build the YAML lint worker (lazy-loaded by CM6.yamlLinter)
          npx esbuild entry-lint-worker.js --bundle --format=iife --minify --target=es2019 --outfile=../../root/www/luci-static/resources/openclash/js/lint-worker.min.js --legal-comments=none
          # Minify page scripts (skip prebuilt *.min.js bundles and third-party files)
          # --charset=utf8 keeps the sources byte-identical; the server-side template
          # compile relies on the exact bytes (ascii charset would escape non-ASCII text).
          JS_DIR="../../root/www/luci-static/resources/openclash/js"
          for js in "$JS_DIR"/*.js; do
            [ -f "$js" ] || continue
            case "$(basename "$js")" in *.min.js) continue ;; esac
            SIZE_BEFORE_JS=$(wc -c < "$js")
            npx esbuild "$js" --minify --charset=utf8 --target=es2019 --outfile="$js.tmp"
            mv "$js.tmp" "$js"
            SIZE_AFTER_JS=$(wc -c < "$js")
            echo "$(basename "$js") minified: ${SIZE_BEFORE_JS} -> ${SIZE_AFTER_JS} bytes ($(( 100 - SIZE_AFTER_JS * 100 / SIZE_BEFORE_JS ))% reduction)"
          done
          # Minify every stylesheet in place (sources live in luci-static)
          CSS_DIR="../../root/www/luci-static/resources/openclash/css"
          for css in "$CSS_DIR"/*.css; do
            [ -f "$css" ] || continue
            SIZE_BEFORE=$(wc -c < "$css")
            npx lightningcss --minify --targets 'iOS >= 12, safari >= 12, android >= 4.4' "$css" -o "$css.tmp"
            mv "$css.tmp" "$css"
            SIZE_AFTER=$(wc -c < "$css")
            echo "$(basename "$css") minified: ${SIZE_BEFORE} -> ${SIZE_AFTER} bytes ($(( 100 - SIZE_AFTER * 100 / SIZE_BEFORE ))% reduction)"
          done
          rm -rf node_modules

      - name: Compile po2lmo
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}/package/luci-app-openclash/tools/po2lmo
          make && sudo make install

      - name: Compile OpenClash
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          if [ -f ../${{ matrix.target.sdk_tar }} ]; then
            make defconfig
          fi
          make package/luci-app-openclash/compile V=99
          if [ ! -f bin/packages/x86_64/base/${{ matrix.target.artifact_pattern }} ]; then
            mkdir -p bin/packages/x86_64/base
            find bin -name "luci-app-openclash_*.ipk" -exec cp {} bin/packages/x86_64/base/ \; 2>/dev/null || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclash-${{ matrix.target.name }}
          path: tmp/${{ matrix.target.sdk_dir }}/bin/packages/x86_64/base/${{ matrix.target.artifact_pattern }}
          if-no-files-found: error

  Post-Process:
    runs-on: ubuntu-latest
    needs: [Compile, Get-Version]
    permissions:
      contents: write
    steps:
      - name: Download IPK Artifact
        uses: actions/download-artifact@v4
        with:
          name: openclash-ipk
          path: dist

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: openclash-apk
          path: dist

      - name: Generate release metadata
        working-directory: dist
        env:
          RELEASE_VERSION: v${{ needs.Get-Version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" > version.txt
          sha256sum luci-app-openclash_*.ipk luci-app-openclash-*.apk version.txt > checksums.txt
          sha256sum -c checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.Get-Version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name == 'dev' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            OpenClash fork using clash-cube/mihomo OpenConnect releases for Meta core updates.
            The plugin updates from localhost-copilot/OpenClash to preserve fork customizations.
            Install the IPK or APK matching your package manager. Core updates retain the clash_meta installation path.
